<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 暖黑底，顶亮底暗，呼应终端背景 #1a1918 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2723"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <!-- 顶部柔光，制造立体感 -->
    <radialGradient id="glow" cx="0.5" cy="0.0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS 圆角方（squircle 近似），内容区 824×824，四周留白 100 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <!-- 顶边高光 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- 终端提示符 chevron ">" -->
  <polyline points="300,398 414,512 300,626" fill="none"
            stroke="#d97757" stroke-width="50"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 转录文本行：一段对话（黏土=提问，灰=回答），表达“会话记录” -->
  <g>
    <rect x="482" y="400" width="342" height="50" rx="25" fill="#d97757"/>
    <rect x="482" y="487" width="252" height="50" rx="25" fill="#8e8478"/>
    <rect x="482" y="574" width="190" height="50" rx="25" fill="#8e8478"/>
  </g>
</svg>
