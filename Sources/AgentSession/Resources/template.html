  const validTsMs = iso => { if (!iso) return null; const ms = Date.parse(iso); return Number.isFinite(ms) ? ms : null; };

  // copy text to clipboard with a graceful fallback (file:// or older browsers)
  function copyText(txt, btn) {
    const flash = () => {
      const o = btn.textContent; btn.textContent = '已复制'; btn.classList.add('ok');
      setTimeout(() => { btn.textContent = o; btn.classList.remove('ok'); }, 1200);
    };
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); flash(); } catch (e) {}
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(flash, fallback);
    else fallback();
  }
  const clipText = c => esc(c && typeof c === 'object' ? c.text : c) +
    (c && c.clipped ? `\n<span class="clip-note">… 已截断，原文 ${c.full_len.toLocaleString()} 字符</span>` : '');

  const clamp = (v, min, max) => Math.round(Math.min(Math.max(Number(v) || 0, min), max));
  function isDesktopPaneMode() { return window.innerWidth >= PANE.desktopMin; }
  function fitPaneLayout(left, right) {
    left = clamp(left, PANE.leftMin, PANE.leftMax);
    right = clamp(right, PANE.rightMin, PANE.rightMax);
    if (!isDesktopPaneMode()) return { left, right };
    const w = shell.getBoundingClientRect().width || window.innerWidth;
    const hasRight = shell.classList.contains('show-right');
    const handles = PANE.resizerWidth * (hasRight ? 2 : 1);
    const maxLeft = Math.max(PANE.leftMin, Math.min(PANE.leftMax, w - (hasRight ? PANE.rightMin : 0) - PANE.centerMin - handles));
    left = clamp(left, PANE.leftMin, maxLeft);
    if (hasRight) {
      const maxRight = Math.max(PANE.rightMin, Math.min(PANE.rightMax, w - left - PANE.centerMin - handles));
      right = clamp(right, PANE.rightMin, maxRight);
    }
    return { left, right };
  }
  function applyPaneLayout(left, right, opts = {}) {
    if (opts.preferred) {
      panePreferred.left = clamp(left, PANE.leftMin, PANE.leftMax);
      panePreferred.right = clamp(right, PANE.rightMin, PANE.rightMax);
    }
    const next = fitPaneLayout(left, right);
    paneLayout.left = next.left; paneLayout.right = next.right;
    shell.style.setProperty('--pane-left-width', paneLayout.left + 'px');
    shell.style.setProperty('--pane-right-width', paneLayout.right + 'px');
    updateResizerA11y();
  }
  function postPaneLayout() {
    const mh = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.paneLayout;
    if (mh) mh.postMessage({ left: panePreferred.left, right: panePreferred.right });
  }
  function setResizerValue(el, min, max, value, enabled) {
    if (!el) return;
    el.setAttribute('aria-valuemin', String(min));
    el.setAttribute('aria-valuemax', String(max));
    el.setAttribute('aria-valuenow', String(value));
    el.tabIndex = enabled ? 0 : -1;
    el.setAttribute('aria-disabled', enabled ? 'false' : 'true');
  }
  function updateResizerA11y() {
    const desktop = isDesktopPaneMode();
    setResizerValue(leftResizer, PANE.leftMin, PANE.leftMax, paneLayout.left, desktop);
    setResizerValue(rightResizer, PANE.rightMin, PANE.rightMax, paneLayout.right,
      desktop && shell.classList.contains('show-right'));
  }
  function onPanePointerMove(e) {
    if (!paneDrag) return;
    const dx = e.clientX - paneDrag.startX;
    if (paneDrag.side === 'left') applyPaneLayout(paneDrag.startLeft + dx, paneDrag.startRight);
    else applyPaneLayout(paneDrag.startLeft, paneDrag.startRight - dx);
  }
  function endPaneDrag(e) {
    if (!paneDrag) return;
    const d = paneDrag;
    d.el.removeEventListener('pointermove', onPanePointerMove);
    d.el.removeEventListener('pointerup', endPaneDrag);
    d.el.removeEventListener('pointercancel', endPaneDrag);
    if (d.el.releasePointerCapture) { try { d.el.releasePointerCapture(d.pointerId); } catch (err) {} }
    d.el.classList.remove('dragging');
    shell.classList.remove('resizing');
    paneDrag = null;
    if (d.side === 'left') panePreferred.left = paneLayout.left;
    else panePreferred.right = paneLayout.right;
    postPaneLayout();
  }
  function startPaneDrag(side, el, e) {
    if (e.button != null && e.button !== 0) return;
    if (!isDesktopPaneMode() || (side === 'right' && !shell.classList.contains('show-right'))) return;
    e.preventDefault();
    paneDrag = { side, el, pointerId: e.pointerId, startX: e.clientX,
      startLeft: paneLayout.left, startRight: paneLayout.right };
    if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    shell.classList.add('resizing');
    el.addEventListener('pointermove', onPanePointerMove);
    el.addEventListener('pointerup', endPaneDrag);
    el.addEventListener('pointercancel', endPaneDrag);
  }
  function resetPaneWidth(side) {
    if (!isDesktopPaneMode()) return;
    const left = side === 'left' ? PANE.leftDefault : panePreferred.left;
    const right = side === 'right' ? PANE.rightDefault : panePreferred.right;
    applyPaneLayout(left, right, { preferred: true });
    postPaneLayout();
  }
  function nudgePaneWidth(side, delta) {
    if (!isDesktopPaneMode() || (side === 'right' && !shell.classList.contains('show-right'))) return;
    const left = side === 'left' ? panePreferred.left + delta : panePreferred.left;
    const right = side === 'right' ? panePreferred.right - delta : panePreferred.right;
    applyPaneLayout(left, right, { preferred: true });
    postPaneLayout();
  }
  function onPaneKeydown(side, e) {
    const step = e.shiftKey || e.altKey ? 40 : 10;
    if (e.key === 'ArrowLeft') { e.preventDefault(); nudgePaneWidth(side, -step); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); nudgePaneWidth(side, step); }
    else if (e.key === 'Home') { e.preventDefault(); resetPaneWidth(side); }
    else if (e.key === 'End') {
      e.preventDefault();
      if (side === 'left') applyPaneLayout(PANE.leftMax, panePreferred.right, { preferred: true });
      else applyPaneLayout(panePreferred.left, PANE.rightMax, { preferred: true });
      postPaneLayout();
    }
  }
  function bindPaneResizers() {
    if (leftResizer) {
      leftResizer.onpointerdown = e => startPaneDrag('left', leftResizer, e);
      leftResizer.ondblclick = () => resetPaneWidth('left');
      leftResizer.onkeydown = e => onPaneKeydown('left', e);
    }
    if (rightResizer) {
      rightResizer.onpointerdown = e => startPaneDrag('right', rightResizer, e);
      rightResizer.ondblclick = () => resetPaneWidth('right');
      rightResizer.onkeydown = e => onPaneKeydown('right', e);
    }
    updateResizerA11y();
    window.addEventListener('resize', () => applyPaneLayout(panePreferred.left, panePreferred.right));
  }

  // ——— minimal, self-contained markdown for human/agent prose ———
  // Inline: **bold**, *italic*, `code`, ~~strike~~, [text](url). Underscores are
  // left alone so snake_case identifiers survive. Content is HTML-escaped first;
  // every generated tag comes from our own replacements.
  function inline(s) {
    const ic = [];
    s = s.replace(/`([^`]+)`/g, (m, c) => { ic.push(c); return `@@IC${ic.length - 1}@@`; });
    s = esc(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
         .replace(/(^|[^*])\*(\S[^*\n]*?\S|\S)\*/g, '$1<em>$2</em>')
         .replace(/~~([^~]+)~~/g, '<del>$1</del>')
         .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) =>
           /^(https?:|\/|#)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : m);
    return s.replace(/@@IC(\d+)@@/g, (m, i) => `<code>${esc(ic[i])}</code>`);
  }
  function md(src) {
    if (src == null) return '';
    let text = String(src).replace(/\r\n?/g, '\n');
    const codes = [];
    text = text.replace(/```[^\n]*\n([\s\S]*?)```/g, (m, body) => {
      codes.push(`<pre class="md-pre">${esc(body.replace(/\n+$/, ''))}</pre>`);
      return `@@CB${codes.length - 1}@@`;
    });
    const lines = text.split('\n');
    const isSep = l => l.includes('-') && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
    const cells = l => { let s = l.trim(); if (s.startsWith('|')) s = s.slice(1); if (s.endsWith('|')) s = s.slice(0, -1); return s.split('|').map(c => c.trim()); };
    const isBlock = l => /^\s*$/.test(l) || /^(#{1,6})\s/.test(l) || /^\s*[-*+]\s+/.test(l)
      || /^\s*\d+\.\s+/.test(l) || /^\s*>/.test(l) || /^@@CB\d+@@$/.test(l.trim());
    const out = []; let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      const cm = /^@@CB(\d+)@@$/.exec(l.trim());
      if (cm) { out.push(codes[+cm[1]]); i++; continue; }
      if (/^\s*$/.test(l)) { i++; continue; }
      const h = /^(#{1,6})\s+(.*)$/.exec(l);
      if (h) { const n = h[1].length; out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
      if (/^\s*([*\-_])(\s*\1){2,}\s*$/.test(l)) { out.push('<hr class="md-hr">'); i++; continue; }
      if (l.includes('|') && i + 1 < lines.length && isSep(lines[i + 1])) {
        const head = cells(l); i += 2; const rows = [];
        while (i < lines.length && lines[i].includes('|') && !/^\s*$/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
        out.push(`<div class="md-tablewrap"><table class="md-table"><thead><tr>`
          + head.map(c => `<th>${inline(c)}</th>`).join('') + `</tr></thead><tbody>`
          + rows.map(r => `<tr>` + head.map((_, ci) => `<td>${inline(r[ci] || '')}</td>`).join('') + `</tr>`).join('')
          + `</tbody></table></div>`);
        continue;
      }
      if (/^\s*>/.test(l)) {
        const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out.push(`<blockquote class="md-quote">${inline(buf.join('\n')).replace(/\n/g, '<br>')}</blockquote>`); continue;
      }
      if (/^\s*[-*+]\s+/.test(l)) {
        const items = []; while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*+]\s+/, '')); i++; }
        out.push(`<ul class="md-list">` + items.map(it => `<li>${inline(it)}</li>`).join('') + `</ul>`); continue;
      }
      if (/^\s*\d+\.\s+/.test(l)) {
        const items = []; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*\d+\.\s+/, '')); i++; }
        out.push(`<ol class="md-list">` + items.map(it => `<li>${inline(it)}</li>`).join('') + `</ol>`); continue;
      }
      const buf = [];
      while (i < lines.length && !isBlock(lines[i]) && !(lines[i].includes('|') && i + 1 < lines.length && isSep(lines[i + 1]))) { buf.push(lines[i]); i++; }
      out.push(`<p>${inline(buf.join('\n')).replace(/\n/g, '<br>')}</p>`);
    }
    return out.join('').replace(/@@CB(\d+)@@/g, (m, i) => codes[i] || '');
  }
  function mdProse(c) {
    const raw = c && typeof c === 'object' ? c.text : (c || '');
    return md(raw) + (c && c.clipped
      ? `<div class="clip-note">… 已截断，原文 ${c.full_len.toLocaleString()} 字符</div>` : '');
  }

  const TOOL_ICON = { Bash:'$', Read:'▢', Write:'✎', Edit:'✎', Glob:'◇', Grep:'⌕',
    ToolSearch:'⌕', WebSearch:'⌕', WebFetch:'↡', Skill:'★', Agent:'⬡', Task:'⬡',
    TaskCreate:'☐', TaskUpdate:'☑', AskUserQuestion:'?', ExitPlanMode:'✓' };

  // A code pane with a hover "复制" button. `raw` is the exact text copied to the
  // clipboard (no display prefixes); `displayHtml` is the rendered pre body.
  function copyPane(raw, displayHtml, extraCls) {
    return `<div class="codewrap"><button class="copy-btn" type="button" data-copy="${esc(raw)}">复制</button>`
      + `<pre class="md-pre ${extraCls || ''}">${displayHtml}</pre></div>`;
  }
  function signedLines(str, sign, cls) {
    return String(str == null ? '' : str).split('\n')
      .map(l => `<span class="dl ${cls}">${sign} ${esc(l)}</span>`).join('\n');
  }
  // render a tool call's input: Edit -> old/new diff, Write -> code, else JSON
  function renderToolInput(name, input) {
    input = input || {};
    if (name === 'Edit' || name === 'MultiEdit') {
      const edits = name === 'MultiEdit' && Array.isArray(input.edits) ? input.edits : [input];
      return edits.map(e => `<div class="io-label">− 原内容</div>${copyPane(e.old_string || '', signedLines(e.old_string, '−', 'old'), 'diff')}`
        + `<div class="io-label">+ 新内容</div>${copyPane(e.new_string || '', signedLines(e.new_string, '+', 'new'), 'diff')}`).join('');
    }
    if (name === 'Write') {
      return `<div class="io-label">写入内容</div>${copyPane(input.content || '', esc(input.content || ''))}`;
    }
    if (name === 'Bash' && input.command) {
      return copyPane(input.command, esc(input.command))
        + (input.description ? `<div class="io-note">${esc(input.description)}</div>` : '');
    }
    const json = JSON.stringify(input, null, 2);
    return copyPane(json, esc(json));
  }

  function resultPane(r) {
    const errCls = r.is_error ? ' error' : '';
    return `<div class="io-label res${errCls}">${r.is_error ? '✖ 输出 (error)' : '↳ 输出'}</div>`
      + `<div class="pane${errCls}">${clipText(r.content)}</div>`;
  }

  function userBubble(t, anchorId) {
    const id = anchorId != null ? ` id="turn-${anchorId}"` : '';
    const slashArgs = t.kind === 'slash' && t.args && (t.args.text || '');
    const body = t.kind === 'slash'
      ? '<span class="cmd-name">/' + esc(t.cmd) + '</span>'
        + (slashArgs ? '<span class="cmd-args">' + esc(slashArgs) + '</span>'
          + (t.args.clipped ? `<div class="clip-note">… 已截断，原文 ${t.args.full_len.toLocaleString()} 字符</div>` : '') : '')
      : mdProse(t.text);
    const doc = (t.kind === 'slash' && t.skill_body)
      ? `<details class="skill-doc"><summary>查看 skill 内容</summary>`
        + `<div class="skill-body text">${mdProse(t.skill_body)}</div></details>`
      : '';
    return `<div class="msg-user ${t.kind === 'slash' ? 'slash' : ''}"${id}>`
      + `<div class="who">user<span class="ts">${niceTime(t.ts)}</span></div>`
      + `<div class="text">${body}</div>${doc}</div>`;
  }

  function rebuildIndex() { byId = Object.fromEntries(DATA.sessions.map(s => [s.id, s])); }
  function setPath(t) { document.getElementById('title-path').textContent = t; }
  function parseRoute() {
    const m = /^#s\/([^?]+)(?:\?(.*))?$/.exec(location.hash);
    if (!m) return null;
    const qs = new URLSearchParams(m[2] || '');
    return { id: decodeURIComponent(m[1]), tab: qs.get('tab') || 'main', right: qs.get('right') || null };
  }
  function sessionHash(id, tab, right) {
    const qs = new URLSearchParams();
    if (tab && tab !== 'main') qs.set('tab', tab);
    if (right) qs.set('right', right);
    const q = qs.toString();
    return '#s/' + encodeURIComponent(id) + (q ? '?' + q : '');
  }
  function setSessionRoute(id, tab, right, opts = {}) {
    const hash = sessionHash(id, tab || 'main', right || null);
    if (location.hash === hash) return;
    if (opts.silent && history.replaceState) history.replaceState(null, '', hash);
    else location.hash = hash;
  }
  function restoreRightPane(right) {
    if (!ACTIVE || !right) return;
    if (right === 'info') { showInfo({ updateHash: false }); return; }
    if (right.startsWith('tool:')) showTool(right.slice('tool:'.length), { updateHash: false });
  }

  // ——— left pane: project-grouped session list (persistent) ———
  function renderSidebar() {
    searchActive = false;   // 渲染普通列表即退出搜索态
    const sc = DATA.scope || {};
    const ctl = DATA.controls;
    let filters = '';
    if (ctl) {
      const sinceOpts = [['24h', '最近 24 小时'], ['7d', '最近 7 天'], ['30d', '最近 30 天'], ['all', '全部时间']];
      const projOpts = [['', '全部项目'], ...(ctl.projects || []).map(p => [p, p])];
      filters = `<div class="side-filters">`
        + `<select class="side-sel" id="f-since" aria-label="时间范围">`
        + sinceOpts.map(([v, l]) => `<option value="${v}"${v === ctl.since ? ' selected' : ''}>${esc(l)}</option>`).join('')
        + `</select>`
        + `<select class="side-sel" id="f-proj" aria-label="项目">`
        + projOpts.map(([v, l]) => `<option value="${esc(v)}"${v === (ctl.project || '') ? ' selected' : ''}>${esc(l)}</option>`).join('')
        + `</select></div>`;
    }
    // 截断时显示「已显示 / 共」，让用户知道还有更多可加载。
    const baseCount = sc.shown == null ? ''
      : (sc.total_matched > sc.shown ? `${sc.shown} / ${sc.total_matched} 段对话` : `${sc.shown} 段对话`);
    let h = `<div class="side-head"><div class="cmd"><span class="prompt">&gt;</span> session-viewer</div>`
      + filters
      + `<input class="side-search" id="list-search" type="search" placeholder="${bridge('search') ? '筛选标题…（回车搜全部正文）' : '筛选会话…（标题 / 项目 / skill）'}" aria-label="筛选会话">`
      + `<span class="side-count" id="list-count">${baseCount}</span></div>`;

    // 把时间范围 / 项目下拉接到原生桥（独立网页无此桥，下拉不渲染）。
    function wireFilters() {
      const since = leftEl.querySelector('#f-since'), proj = leftEl.querySelector('#f-proj');
      const post = () => {
        const mh = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.scope;
        if (mh) mh.postMessage({ since: since.value, project: proj.value || null });
      };
      if (since) since.onchange = post;
      if (proj) proj.onchange = post;
    }

    if (!DATA.sessions.length) {
      h += `<div class="empty">这个范围内还没有会话。</div>`;
      leftEl.innerHTML = h;
      wireFilters();
      return;
    }
    // group by project, preserving newest-first order within each group
    const groups = new Map();
    DATA.sessions.forEach(s => {
      const k = s.project_label || '—';
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(s);
    });
    h += `<div class="side-list">`;
    // 项目分组较多时，默认只展开第一组，避免侧栏过长（搜索时会自动展开命中组）。
    const collapseRest = groups.size > 5;
    let gi = 0;
    for (const [proj, list] of groups) {
      const openAttr = (!collapseRest || gi === 0) ? ' open' : '';
      gi++;
      h += `<details class="sgroup"${openAttr} data-group><summary><span class="gname">${esc(proj)}</span>`
        + `<span class="gcount">${list.length}</span></summary>`;
      list.forEach(s => {
        const hay = `${s.preview} ${s.project_label} ${s.worktree_name || ''} ${s.raw_project_label || ''} ${(s.skills || []).join(' ')} ${s.git_branch || ''} ${s.source || ''}`.toLowerCase();
        const toks = s.usage && s.usage.total ? ` · ${fmtTok(s.usage.total)}` : '';
        const tags = s.is_worktree && s.worktree_name
          ? `<div class="srow-tags"><span class="chip worktree">worktree: ${esc(s.worktree_name)}</span></div>`
          : '';
        h += `<button class="srow" data-id="${esc(s.id)}" data-hay="${esc(hay)}">`
          + `<div class="srow-title">${srcBadge(s.source)}${esc(s.preview)}</div>`
          + `<div class="srow-meta">${s.num_user_msgs} 轮 · ${s.num_tool_calls} 工具`
          + (s.num_subagents ? ` · ${s.num_subagents} sub` : '')
          + ` · ${niceDate(s.last_ts)}${toks}</div>${tags}</button>`;
      });
      h += `</details>`;
    }
    // 「加载更多」：仅在原生壳（有 scope 桥）且确有截断时出现。
    if (ctl && sc.total_matched > sc.shown) {
      h += `<button class="load-more" id="load-more">加载更多 · 还有 ${sc.total_matched - sc.shown} 段</button>`;
    }
    h += `</div>`;
    leftEl.innerHTML = h;
    wireFilters();

    const more = leftEl.querySelector('#load-more');
    if (more) more.onclick = () => {
      const mh = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.scope;
      if (!mh) return;
      more.disabled = true; more.textContent = '加载中…';
      mh.postMessage({ since: ctl.since, project: ctl.project || null, limit: sc.shown + 40 });
    };

    leftEl.querySelectorAll('.srow').forEach(el =>
      el.onclick = () => { location.hash = '#s/' + el.dataset.id; shell.classList.remove('show-left'); });

    const box = leftEl.querySelector('#list-search'), cnt = leftEl.querySelector('#list-count');
    if (box) box.oninput = () => {
      const q = box.value.trim().toLowerCase();
      let shown = 0;
      leftEl.querySelectorAll('.srow').forEach(el => {
        const hit = !q || el.dataset.hay.includes(q);
        el.style.display = hit ? '' : 'none';
        if (hit) shown++;
      });
      // hide groups with no visible rows; expand groups that have matches while searching
      leftEl.querySelectorAll('[data-group]').forEach(g => {
        const any = [...g.querySelectorAll('.srow')].some(r => r.style.display !== 'none');
        g.style.display = any ? '' : 'none';
        if (q && any) g.open = true;
      });
      cnt.textContent = q ? `${shown} / ${DATA.sessions.length}` : baseCount;
    };
    // 回车：把当前输入交给原生做全局正文搜索（扫描 scope 内全部会话原文）。
    if (box) box.onkeydown = e => {
      if (e.key !== 'Enter') return;
      const q = box.value.trim();
      const mh = bridge('search');
      if (!q || !mh) return;
      e.preventDefault();
      searchActive = true; lastSearchQuery = q;
      cnt.textContent = '搜索中…';
      mh.postMessage({ query: q });
    };
  }

  // 渲染全局正文搜索结果：扁平列表 + 命中片段，点击照常进入详情。
  function renderSearchResults(res) {
    searchActive = true; lastSearchQuery = res.query || lastSearchQuery;
    const sessions = res.sessions || [];
    sessions.forEach(s => { if (!byId[s.id]) byId[s.id] = s; });   // 合并以支持跳转
    let h = `<div class="side-head"><div class="cmd"><span class="prompt">&gt;</span> 搜索结果</div>`
      + `<button class="load-more" id="search-clear">× 清除搜索「${esc(res.query)}」</button>`
      + `<span class="side-count">${res.count} 段命中</span></div>`;
    if (!sessions.length) {
      h += `<div class="empty">没有会话的正文包含「${esc(res.query)}」。</div>`;
    } else {
      h += `<div class="side-list">`;
      sessions.forEach(s => {
        const snip = s.snippet ? `<div class="srow-snip">${markHits(s.snippet, res.query)}</div>` : '';
        h += `<button class="srow" data-id="${esc(s.id)}">`
          + `<div class="srow-title">${esc(s.preview)}</div>`
          + `<div class="srow-meta">${esc(s.project_label)} · ${niceDate(s.last_ts)}</div>`
          + snip + `</button>`;
      });
      h += `</div>`;
    }
    leftEl.innerHTML = h;
    const clear = leftEl.querySelector('#search-clear');
    if (clear) clear.onclick = () => renderSidebar();
    leftEl.querySelectorAll('.srow').forEach(el =>
      el.onclick = () => { location.hash = '#s/' + el.dataset.id; shell.classList.remove('show-left'); });
  }

  function markHits(text, q) {
    const out = esc(text);
    if (!q) return out;
    try {
      const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      return out.replace(re, '<mark class="hit">$1</mark>');
    } catch (e) { return out; }
  }

  function highlightSidebar(id) {
    leftEl.querySelectorAll('.srow').forEach(el => el.classList.toggle('active', el.dataset.id === id));
    const cur = leftEl.querySelector('.srow.active');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
  }

  // ——— flatten every subagent (incl. nested + orphans) into a flat tab list ———
  // Returns { agents:[{key,label,conv,isMain,meta,createdMs,order}], subKeyOf: Map(subObject -> key) }
  function collectAgents(session) {
    const mainMeta = { ...session, key: 'main', label: '主 Agent', agent_name: '主 Agent', agent_type: 'main', agent_id: '', is_orphan: false };
    const mainAgent = { key: 'main', label: '主 Agent', conv: session.turns || [], isMain: true, meta: mainMeta, createdMs: validTsMs(session.first_ts), order: -1 };
    const subagents = [];
    const subKeyOf = new Map();
    const seen = new Set(['main']);
    let c = 0;
    const stableKey = (sub, prefix) => {
      const base = sub.key || (sub.agent_id ? 'agent:' + sub.agent_id : prefix + ':' + (c++));
      if (!seen.has(base)) return base;
      let n = 2;
      while (seen.has(base + '-' + n)) n++;
      return base + '-' + n;
    };
    const addSub = (sub, fallbackPrefix) => {
      const key = stableKey(sub, fallbackPrefix);
      seen.add(key);
      subKeyOf.set(sub, key);
      if (!sub.key) sub.key = key;
      const orphan = !!sub.is_orphan || fallbackPrefix === 'orphan';
      const agentName = sub.agent_name || sub.label || sub.agent_type || 'subagent';
      const label = sub.label || (agentName + (orphan ? ' (orphan)' : ''));
      const createdMs = validTsMs(sub.created_ts || sub.parent_ts || sub.first_ts);
      subagents.push({ key, label, conv: sub.turns || [], isMain: false, meta: sub, createdMs, order: c++ });
      walk(sub.turns);
    };
    const walk = turns => {
      for (const t of (turns || [])) {
        if (t.role === 'assistant' && t.kind === 'tool_use' && Array.isArray(t.subagents)) {
          for (const sub of t.subagents) addSub(sub, 'sub');
        }
      }
    };
    walk(session.turns);
    for (const sub of (session.orphan_subagents || [])) addSub(sub, 'orphan');
    subagents.sort((a, b) => (a.createdMs ?? Infinity) - (b.createdMs ?? Infinity) || a.order - b.order);
    return { agents: [mainAgent, ...subagents], subKeyOf };
  }

  function agentTitle(agent) {
    const meta = agent && agent.meta || {};
    if (agent && agent.isMain) return agent.label || '主 Agent';
    return meta.agent_name || agent.label || meta.agent_type || 'subagent';
  }

  function agentTooltip(agent) {
    const meta = agent && agent.meta || {};
    const desc = meta.agent_description;
    const preview = meta.preview && meta.preview !== '(no text prompt)' ? meta.preview : '';
    return desc || preview || agentTitle(agent);
  }

  function agentDisplayTitle(agent) {
    const name = agentTitle(agent);
    const meta = agent && agent.meta || {};
    const desc = meta.agent_description;
    return agent && !agent.isMain && desc ? `${name}（${desc}）` : name;
  }

  function groupSubagentTabs(agents) {
    const groups = [];
    for (const agent of agents.filter(a => !a.isMain)) {
      const ms = agent.createdMs;
      const last = groups[groups.length - 1];
      if (ms == null || !last || last.startMs == null || ms - last.startMs > 60000) {
        groups.push({ startMs: ms, startTs: ms == null ? null : new Date(ms).toISOString(), items: [agent] });
      } else {
        last.items.push(agent);
      }
    }
    return groups;
  }

  // ——— one pass over a conversation -> { mid, cards, anchors } ———
  // mid   = clean middle column (prompts, replies, thinking, one-line tool anchors)
  // cards = Map(tid -> { name, html }); the right pane renders ONE card on demand,
  //         when its anchor in the middle column is clicked — never the full list.
  // Display-only path shortening for the tool arg line. The full path stays in
  // `t.summary` (and in the title= tooltip); we never touch the parsed data, so the
  // --dump-json golden parity with extract-session.mjs is preserved.
  function homeDir() { return (DATA.root || '').replace(/\/\.claude\/projects$/, ''); }
  function shortenArg(name, summary) {
    let s = summary || '';
    if (name === 'Read' || name === 'Write' || name === 'Edit') {
      const home = homeDir();
      if (home && s.startsWith(home + '/')) s = '~' + s.slice(home.length);
      const parts = s.split('/');
      if (parts.length > 3) s = '…/' + parts.slice(-2).join('/');
    }
    return s;
  }

  function toolCard(t, res, tid) {
    const ic = TOOL_ICON[t.name] || '⚙';
    const errCls = res && res.is_error ? ' has-error' : '';
    return `<details class="tcard${errCls}" id="tcard-${tid}"><summary><span class="icon">${ic}</span>`
      + `<span class="lbl">${esc(t.name)}</span><span class="arg" title="${esc(t.summary)}">${esc(shortenArg(t.name, t.summary))}</span>`
      + (res && res.is_error ? `<span class="err-flag">error</span>` : '') + `</summary>`
      + renderToolInput(t.name, t.input)
      + (res ? resultPane(res) : '')
      + `</details>`;
  }

  function renderConversationSplit(turns, tabKey, subKeyOf) {
    const resultById = new Map();
    for (const t of turns) {
      if (t.role === 'tool' && t.kind === 'tool_result' && t.tool_use_id
          && !resultById.has(t.tool_use_id)) resultById.set(t.tool_use_id, t);
    }
    const merged = new Set();
    let mid = '', n = 0;
    const cards = new Map();
    const anchors = [];
    let open = false, track = '';
    const flush = () => { if (!open) return; mid += `<div class="agent-track">${track}</div></div>`; track = ''; open = false; };

    for (const t of turns) {
      const isUser = t.role === 'user' && (t.kind === 'message' || t.kind === 'slash');
      if (isUser) {
        flush();
        const ai = anchors.push(t) - 1;
        mid += `<div class="exchange">` + userBubble(t, ai);
        open = true;
        continue;
      }
      let html = '';
      if (t.role === 'assistant' && t.kind === 'text') {
        html = `<div class="msg-asst"><div class="who">claude<span class="ts">${niceTime(t.ts)}</span></div>`
          + `<div class="text">${mdProse(t.text)}</div></div>`;
      } else if (t.role === 'assistant' && t.kind === 'thinking') {
        html = `<details class="blk think"><summary><span class="icon">🧠</span>`
          + `<span class="lbl">thinking</span></summary>`
          + `<div class="pane">${clipText(t.text)}</div></details>`;
      } else if (t.role === 'assistant' && t.kind === 'tool_use') {
        const ic = TOOL_ICON[t.name] || '⚙';
        const res = t.id ? resultById.get(t.id) : null;
        if (res) merged.add(t.id);
        const subs = Array.isArray(t.subagents) ? t.subagents : [];
        if (subs.length) {
          // one jump-anchor per spawned subagent, switching the top tab (no tool card)
          html = subs.map(sub => {
            const k = subKeyOf.get(sub);
            const name = sub.agent_name || sub.label || sub.agent_type || 'subagent';
            const desc = sub.agent_description || '';
            const title = desc || sub.preview || name;
            return `<button class="tool-anchor agent-jump" data-tab="${esc(k || '')}" title="${esc(title)}">`
              + `<span class="ta-ic">⬡</span><span class="ta-name">${esc(name)}</span>`
              + `<span class="ta-arg">${esc(desc || '查看 subagent 对话 →')}</span></button>`;
          }).join('');
        } else {
          const tid = `${tabKey}-${n++}`;
          cards.set(tid, { name: t.name, html: toolCard(t, res, tid) });
          const errCls = res && res.is_error ? ' has-error' : '';
          html = `<button class="tool-anchor${errCls}" data-tool="${esc(tid)}">`
            + `<span class="ta-ic">${ic}</span><span class="ta-name">${esc(t.name)}</span>`
            + `<span class="ta-arg" title="${esc(t.summary)}">${esc(shortenArg(t.name, t.summary))}</span></button>`;
        }
      } else if (t.role === 'tool' && t.kind === 'tool_result') {
        if (merged.has(t.tool_use_id)) continue; // already folded into its tool card
        // standalone result -> its own on-demand card + a middle anchor to reach it
        const tid = `${tabKey}-${n++}`;
        const errCls = t.is_error ? ' has-error' : '';
        cards.set(tid, { name: t.is_error ? 'result (error)' : 'result',
          html: `<details class="tcard${errCls}" id="tcard-${tid}"><summary><span class="icon">${t.is_error ? '✖' : '↳'}</span>`
            + `<span class="lbl">result${t.is_error ? ' (error)' : ''}</span></summary>`
            + `<div class="pane${t.is_error ? ' error' : ''}">${clipText(t.content)}</div></details>` });
        html = `<button class="tool-anchor${errCls}" data-tool="${esc(tid)}">`
          + `<span class="ta-ic">${t.is_error ? '✖' : '↳'}</span><span class="ta-name">result</span>`
          + `<span class="ta-arg">${t.is_error ? '(error)' : ''}</span></button>`;
        if (open) track += html; else mid += html;
        continue;
      }
      if (open) track += html; else mid += html;
    }
    flush();
    return { mid, cards, anchors };
  }

  // ——— detail view: tab bar + center conversation + right tool pane ———
  let ACTIVE = null; // { id, session, agents, subKeyOf, tab }

  const hasDetail = s => s && Array.isArray(s.turns);
  function requestDetail(id, s) {
    const mh = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.sessionDetail;
    if (!mh) return false;
    const token = ++detailToken;
    s.__detail_loading = true;
    s.__detail_token = token;
    mh.postMessage({ id, token });
    return true;
  }

  function renderDetail(id) {
    const s = byId[id];
    if (!s) { centerEl.innerHTML = '<div class="empty">未找到该会话。</div>'; rightEl.innerHTML = ''; return; }
    const state = parseRoute();
    const requestedTab = state && state.id === id ? (state.tab || 'main') : 'main';
    setPath((s.cwd || s.project_label) + ' — ' + id.slice(0, 8));
    highlightSidebar(id);
    if (!hasDetail(s)) {
      ACTIVE = { id, session: s, agents: [], subKeyOf: new Map(), tab: requestedTab, pending: true };
      if ((!s.__detail_loading || s.__detail_token !== detailToken) && !s.__detail_failed) requestDetail(id, s);
      const msg = s.__detail_loading ? '正在加载详情…'
        : (s.__detail_failed ? '详情加载失败，请稍后刷新重试。' : '当前环境无法请求完整详情。');
      const worktree = s.is_worktree && s.worktree_name ? ` · worktree: ${esc(s.worktree_name)}` : '';
      centerEl.innerHTML = `<div class="dhead"><div class="crumbs">${srcBadge(s.source)}${esc(s.project_label)} / ${esc(s.id)}${worktree}</div>`
        + `<h1>${esc(s.preview)}</h1></div><hr class="hr">`
        + `<div class="empty">${msg}</div>`;
      rightEl.innerHTML = '';
      shell.classList.remove('show-right');
      applyPaneLayout(panePreferred.left, panePreferred.right);
      setInfoActive(false);
      centerEl.scrollTop = 0;
      return;
    }
    const { agents, subKeyOf } = collectAgents(s);
    const tab = agents.some(a => a.key === requestedTab) ? requestedTab : 'main';
    ACTIVE = { id, session: s, agents, subKeyOf, tab };
    renderTab(tab, { updateHash: false });
    if (state && state.id === id && state.right) restoreRightPane(state.right);
  }

  function renderTab(tabKey, opts = {}) {
    if (!ACTIVE) return;
    const { agents, subKeyOf, session: s } = ACTIVE;
    const agent = agents.find(a => a.key === tabKey) || agents[0];
    ACTIVE.tab = agent.key;
    ACTIVE.agent = agent;
    const keepRight = ACTIVE.rightMode === 'info' ? 'info' : null;
    const { mid, cards, anchors } = renderConversationSplit(agent.conv, agent.key, subKeyOf);
    ACTIVE.cards = cards;
    if (opts.updateHash !== false) setSessionRoute(ACTIVE.id, agent.key, keepRight);

    // tab bar — only shown when there's more than the main agent (subagents exist)
    let c = '';
    if (agents.length > 1) {
      const tabButton = a => `<button class="tab ${a.isMain ? 'tab-main' : 'tab-sub'}${a.key === agent.key ? ' active' : ''}" data-tab="${esc(a.key)}" title="${esc(agentTooltip(a))}">`
        + (a.isMain ? '● ' : '⬡ ') + esc(agentDisplayTitle(a)) + `</button>`;
      const main = agents.find(a => a.isMain) || agents[0];
      c = `<div class="tabs"><div class="tab-group">${tabButton(main)}</div>`;
      groupSubagentTabs(agents).forEach(g => {
        c += `<div class="tab-group"><span class="tab-group-label">${esc(g.startTs ? niceTime(g.startTs) : '未知时间')}</span>`
          + g.items.map(tabButton).join('') + `</div>`;
      });
      c += `</div>`;
    }

    // header — session stats now live in the 详细 (session info) panel
    if (agent.isMain) {
      const worktree = s.is_worktree && s.worktree_name ? ` · worktree: ${esc(s.worktree_name)}` : '';
      c += `<div class="dhead"><div class="crumbs">${srcBadge(s.source)}${esc(s.project_label)} / ${esc(s.id)}${worktree}</div>`
        + `<h1>${esc(s.preview)}</h1></div>`;
    } else {
      const meta = agent.meta || {};
      const subPreview = meta.preview && meta.preview !== '(no text prompt)' ? ` · ${esc(meta.preview)}` : '';
      c += `<div class="dhead"><div class="crumbs">subagent · ${esc(s.preview)}${subPreview}</div>`
        + `<h1 title="${esc(agentTooltip(agent))}">⬡ ${esc(agentDisplayTitle(agent))}</h1></div>`;
    }

    c += `<div class="toolbar">`
      + `<input class="search" type="search" placeholder="在当前 Agent 内搜索…（回车跳下一处）" aria-label="搜索会话内容">`
      + `<span class="search-count" id="search-count"></span>`
      + `<button class="tbtn" data-act="toggle" id="toggle-blocks">展开全部</button>`
      + (NATIVE ? `<button class="tbtn" data-act="resume" title="在终端继续此会话（claude --resume）">▷ 继续</button>` : '')
      + (NATIVE ? `<button class="tbtn" data-act="export" title="导出当前对话为 Markdown">⤓ 导出</button>` : '')
      + `<button class="tbtn" id="det-info" data-act="info" title="当前 Agent 信息（Token / 缓存）">ⓘ 详细</button></div>`;

    if (anchors.length > 1) {
      let ticks = '', list = '';
      anchors.forEach((t, i) => {
        const num = String(i + 1).padStart(2, '0');
        const label = t.kind === 'slash' ? '/' + t.cmd : (t.text && t.text.text || '');
        const clean = esc(label.replace(/\s+/g, ' ').slice(0, 130));
        ticks += `<a class="toc-tick" href="#turn-${i}" data-turn="${i}" aria-label="第 ${i + 1} 轮"></a>`;
        list += `<li><a href="#turn-${i}" data-turn="${i}"><span class="n">${num}</span>`
          + `<span class="t">${clean}</span></a></li>`;
      });
      c += `<nav class="toc-rail" aria-label="对话目录"><div class="toc-rail-inner">`
        + `<div class="toc-ticks">${ticks}</div>`
        + `<div class="toc-panel"><div class="toc-panel-head">目录 · ${anchors.length} 轮对话</div>`
        + `<ol>${list}</ol></div></div></nav>`;
    }
    c += `<hr class="hr">`;
    c += mid || `<div class="empty">这个 Agent 没有可显示的对话。</div>`;
    const meta = agent.meta || s;
    c += `<footer>session ${esc(s.id)} · ${esc(meta.cwd || s.cwd || '')}</footer>`;
    centerEl.innerHTML = c;

    // right pane starts empty + collapsed; a single tool renders on demand (showTool)
    rightEl.innerHTML = rheadHTML('工具详情')
      + `<div class="rempty">点击中栏对话里的工具，查看它的详情。</div>`;
    shell.classList.remove('show-right');
    applyPaneLayout(panePreferred.left, panePreferred.right);
    ACTIVE.rightMode = null; setInfoActive(false);

    bindTabInteractions();
    centerEl.scrollTop = 0; rightEl.scrollTop = 0;
  }

  function rheadHTML(label) {
    return `<div class="rhead"><span class="rtitle">${esc(label)}</span>`
      + `<button class="rclose" type="button" title="收起工具栏" aria-label="收起工具栏">×</button></div>`;
  }

  // render exactly ONE tool's detail into the right pane (replacing whatever was there)
  function showTool(tid, opts = {}) {
    if (!ACTIVE || !ACTIVE.cards) return false;
    const card = ACTIVE.cards.get(tid);
    if (!card) return false;
    rightEl.innerHTML = rheadHTML('工具 · ' + card.name) + card.html;
    const d = rightEl.querySelector('details.tcard');
    if (d) { d.open = true; d.classList.remove('flash'); void d.offsetWidth; d.classList.add('flash'); }
    shell.classList.remove('show-left');
    shell.classList.add('show-right');
    applyPaneLayout(panePreferred.left, panePreferred.right);
    ACTIVE.rightMode = 'tool'; setInfoActive(false);
    rightEl.scrollTop = 0;
    bindRightInteractions();
    if (opts.updateHash !== false) setSessionRoute(ACTIVE.id, ACTIVE.tab, 'tool:' + tid, { silent: true });
    return true;
  }

  const fmtTok = n => n >= 1e6 ? (n / 1e6).toFixed(2) + 'M'
    : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n || 0);
  const infoRow = (label, val, cls) =>
    `<div class="sinfo-row${cls ? ' ' + cls : ''}"><span>${esc(label)}</span><b>${esc(String(val))}</b></div>`;
  function setInfoActive(on) {
    ['tgl-info', 'det-info'].forEach(id => {
      const b = document.getElementById(id);
      if (b) b.classList.toggle('active', !!on);
    });
  }

  // render the active agent-level info (token usage, cache coverage, stats) into the right pane
  function showInfo(opts = {}) {
    if (!ACTIVE) return;
    const agent = ACTIVE.agent || (ACTIVE.agents && ACTIVE.agents.find(a => a.key === ACTIVE.tab)) || null;
    const meta = (agent && agent.meta) || ACTIVE.session;
    const u = meta.usage || { input_uncached: 0, cache_create: 0, cache_read: 0, output: 0, input_total: 0, total: 0, cache_pct: 0 };
    const isMain = !agent || agent.isMain;
    const sessionId = meta.session_id || (isMain ? meta.id : ACTIVE.session && ACTIVE.session.id) || '—';
    let h = rheadHTML(isMain ? '会话信息' : 'Agent 信息');
    h += `<div class="sinfo">`;
    h += `<div class="sinfo-sec"><div class="sinfo-h">Token 用量（${isMain ? '主会话，不含 subagent' : '当前 subagent'}）</div>`
      + infoRow('总计', fmtTok(u.total))
      + infoRow('输入 · 未缓存', fmtTok(u.input_uncached), 'sub')
      + infoRow('输入 · 写入缓存', fmtTok(u.cache_create), 'sub')
      + infoRow('输入 · 读取缓存', fmtTok(u.cache_read), 'sub')
      + infoRow('输出', fmtTok(u.output), 'sub')
      + (u.context_size ? infoRow('峰值上下文', fmtTok(u.context_size)) : '')
      + `</div>`;
    h += `<div class="sinfo-sec"><div class="sinfo-h">缓存覆盖率</div>`
      + `<div class="cbar"><span style="width:${u.cache_pct || 0}%"></span></div>`
      + infoRow('读取缓存 / 总输入', (u.cache_pct || 0) + '%')
      + `</div>`;
    h += `<div class="sinfo-sec"><div class="sinfo-h">${isMain ? '会话统计' : 'Agent 统计'}</div>`
      + infoRow('Session ID', sessionId, 'id')
      + infoRow('轮对话', meta.num_user_msgs ?? meta.num_user ?? 0)
      + infoRow('回复', meta.num_assistant_msgs ?? meta.num_assistant ?? 0)
      + infoRow('工具调用', meta.num_tool_calls ?? meta.num_tools ?? 0)
      + infoRow('时长', dur(meta.duration_ms))
      + infoRow('时间', niceDate(meta.first_ts) + ' → ' + niceDate(meta.last_ts))
      + (meta.git_branch ? infoRow('分支', '⎇ ' + meta.git_branch) : '')
      + (meta.is_worktree && meta.worktree_name ? infoRow('Worktree', meta.worktree_name) : '')
      + (meta.is_worktree && meta.raw_project ? infoRow('真实目录', meta.raw_project, 'id') : '')
      + (meta.is_worktree && meta.project_label ? infoRow('归并到', meta.project_label) : '')
      + (!isMain && (meta.agent_name || agentTitle(agent)) ? infoRow('名称', meta.agent_name || agentTitle(agent)) : '')
      + (!isMain && meta.agent_description ? infoRow('描述', meta.agent_description, 'wrap') : '')
      + (!isMain && meta.created_ts ? infoRow('创建时间', niceDate(meta.created_ts)) : '')
      + (!isMain && meta.agent_type ? infoRow('类型', meta.agent_type) : '')
      + (!isMain && meta.agent_id ? infoRow('Agent ID', meta.agent_id) : '')
      + `</div>`;
    h += `</div>`;
    rightEl.innerHTML = h;
    shell.classList.remove('show-left');
    shell.classList.add('show-right');
    applyPaneLayout(panePreferred.left, panePreferred.right);
    ACTIVE.rightMode = 'info'; setInfoActive(true);
    rightEl.scrollTop = 0;
    bindRightInteractions();
    if (opts.updateHash !== false) setSessionRoute(ACTIVE.id, ACTIVE.tab, 'info', { silent: true });
  }

  // (re)bind the right pane's own controls — its content is re-rendered per tool
  function bindRightInteractions() {
    const rclose = rightEl.querySelector('.rclose');
    if (rclose) rclose.onclick = () => {
      shell.classList.remove('show-right');
      applyPaneLayout(panePreferred.left, panePreferred.right);
      if (ACTIVE) {
        ACTIVE.rightMode = null;
        setSessionRoute(ACTIVE.id, ACTIVE.tab, null, { silent: true });
      }
      setInfoActive(false);
    };
    rightEl.querySelectorAll('.copy-btn').forEach(b => b.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      copyText(b.dataset.copy || '', b);
    });
  }

  // 在终端继续当前会话（claude --resume <id>，cd 到会话目录）。
  function resumeSession() {
    if (!ACTIVE) return;
    const s = ACTIVE.session;
    const mh = bridge('resume');
    if (mh) mh.postMessage({ id: s.id, cwd: s.cwd || '', source: s.source || 'claude' });
  }

  // 把当前 Agent 的对话导出为 Markdown，交给原生保存面板写盘。
  function exportSession() {
    if (!ACTIVE) return;
    const agent = ACTIVE.agent || (ACTIVE.agents && ACTIVE.agents.find(a => a.isMain)) || (ACTIVE.agents && ACTIVE.agents[0]);
    const md = sessionToMarkdown(ACTIVE.session, agent);
    const mh = bridge('export');
    const fname = String(ACTIVE.session.id || 'session').slice(0, 8) + '.md';
    if (mh) mh.postMessage({ id: ACTIVE.session.id, filename: fname, markdown: md });
  }

  function turnText(t) {
    const v = t && t.text;
    if (v == null) return '';
    return typeof v === 'object' ? (v.text || '') : String(v);
  }

  function sessionToMarkdown(s, agent) {
    const L = [];
    L.push(`# ${s.preview || s.id}`, '');
    L.push(`- Session: \`${s.id}\``);
    if (s.project_label) L.push(`- Project: ${s.project_label}`);
    if (s.cwd) L.push(`- CWD: ${s.cwd}`);
    if (s.git_branch) L.push(`- Branch: ${s.git_branch}`);
    if (s.first_ts) L.push(`- Time: ${s.first_ts} → ${s.last_ts || ''}`);
    L.push(`- Stats: ${s.num_user_msgs} 轮 · ${s.num_tool_calls} 工具 · ${s.num_subagents || 0} subagent`, '', '---', '');
    const conv = (agent && agent.conv) || s.turns || [];
    for (const t of conv) {
      if (t.role === 'user' && t.kind === 'slash') L.push('## 👤 User', '', '`/' + (t.cmd || '') + '`'
        + (t.args && t.args.text ? '\n\n' + t.args.text : ''), '');
      else if (t.role === 'user') L.push('## 👤 User', '', turnText(t), '');
      else if (t.role === 'assistant' && t.kind === 'thinking') L.push('> 💭 ' + turnText(t).replace(/\n/g, '\n> '), '');
      else if (t.role === 'assistant' && t.kind === 'text') L.push('## 🤖 Assistant', '', turnText(t), '');
      else if (t.kind === 'tool_use') {
        L.push('### 🔧 ' + (t.name || 'tool'), '');
        if (t.summary) L.push('`' + String(t.summary).replace(/`/g, '') + '`', '');
      } else if (t.kind === 'tool_result') {
        const c = t.content, body = c && typeof c === 'object' ? c.text : c;
        if (body) L.push('```', String(body).slice(0, 4000), '```', '');
      }
    }
    return L.join('\n');
  }

  let tocSpy = null;
  // scroll-spy: mark the tick/list-item for the turn currently in the top band
  function setupTocSpy() {
    if (tocSpy) { tocSpy.disconnect(); tocSpy = null; }
    const rail = centerEl.querySelector('.toc-rail');
    if (!rail) return;
    const turns = [...centerEl.querySelectorAll('.msg-user[id^="turn-"]')];
    if (!turns.length) return;
    const ticks = rail.querySelectorAll('.toc-tick');
    const items = rail.querySelectorAll('.toc-panel a[data-turn]');
    const visible = new Set();
    const setActive = idx => {
      ticks.forEach((t, i) => t.classList.toggle('active', i === idx));
      items.forEach((a, i) => a.classList.toggle('active', i === idx));
    };
    tocSpy = new IntersectionObserver(entries => {
      entries.forEach(e => {
        const i = +e.target.id.slice(5);
        if (e.isIntersecting) visible.add(i); else visible.delete(i);
      });
      if (visible.size) setActive(Math.min(...visible));
    }, { root: centerEl, rootMargin: '0px 0px -70% 0px', threshold: 0 });
    turns.forEach(t => tocSpy.observe(t));
  }

  function bindTabInteractions() {
    // switch tabs
    centerEl.querySelectorAll('.tab').forEach(b => b.onclick = () => {
      if (ACTIVE) setSessionRoute(ACTIVE.id, b.dataset.tab, ACTIVE.rightMode === 'info' ? 'info' : null);
    });
    // toc jump (tick-rail + reveal panel)
    centerEl.querySelectorAll('.toc-rail a[data-turn]').forEach(a => a.onclick = e => {
      e.preventDefault();
      const el = document.getElementById('turn-' + a.dataset.turn);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    // expand / collapse all (center thinking blocks + the tool card currently shown)
    centerEl.querySelectorAll('.tbtn').forEach(b => b.onclick = () => {
      const act = b.dataset.act;
      if (act === 'info') { toggleInfo(); return; }
      if (act === 'resume') { resumeSession(); return; }
      if (act === 'export') { exportSession(); return; }
      // 智能切换：有任何折叠的就全部展开，否则全部折叠；按钮文字反映下一步动作。
      const blocks = [...centerEl.querySelectorAll('details.blk'), ...rightEl.querySelectorAll('details.tcard')];
      const open = blocks.some(d => !d.open);
      blocks.forEach(d => d.open = open);
      b.textContent = open ? '折叠全部' : '展开全部';
    });
    // middle tool anchor -> show ONLY that tool's detail on the right
    centerEl.querySelectorAll('.tool-anchor[data-tool]').forEach(b => b.onclick = () => showTool(b.dataset.tool));
    // middle agent jump -> switch to that subagent's tab
    centerEl.querySelectorAll('.tool-anchor.agent-jump[data-tab]').forEach(b => b.onclick = () => {
      if (ACTIVE && b.dataset.tab) setSessionRoute(ACTIVE.id, b.dataset.tab, null);
    });
    // highlight the tick for whichever turn is near the top of the viewport
    setupTocSpy();
    // bind the right pane's initial (placeholder) controls
    bindRightInteractions();
    // in-conversation search across the active tab (center + right)
    setupSearch(centerEl.querySelector('.search'), centerEl.querySelector('#search-count'),
      [centerEl, rightEl]);
  }

  // Walk text nodes in `roots`, wrap matches in <mark class="hit">, open ancestor
  // <details>, and let Enter step through hits. Re-running clears the previous pass.
  function setupSearch(input, counter, roots) {
    if (!input) return;
    let hits = [], idx = -1;
    const clear = () => {
      roots.forEach(root => root.querySelectorAll('mark.hit').forEach(m => {
        const t = document.createTextNode(m.textContent); m.replaceWith(t); t.parentNode.normalize();
      }));
      hits = []; idx = -1; counter.textContent = '';
    };
    const run = q => {
      clear();
      q = q.trim();
      if (q.length < 2) return;
      const ql = q.toLowerCase();
      const targets = [];
      roots.forEach(root => {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode: n => n.parentElement.closest('.toolbar, .tabs, .who, .rhead')
            ? NodeFilter.FILTER_REJECT
            : (n.nodeValue.toLowerCase().includes(ql) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT)
        });
        let n; while ((n = walker.nextNode())) targets.push(n);
      });
      for (const node of targets) {
        const parts = node.nodeValue.split(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig'));
        const frag = document.createDocumentFragment();
        parts.forEach((p, i) => {
          if (i % 2 === 1) { const m = document.createElement('mark'); m.className = 'hit'; m.textContent = p; frag.appendChild(m); hits.push(m); }
          else if (p) frag.appendChild(document.createTextNode(p));
        });
        node.replaceWith(frag);
      }
      hits.forEach(m => { const d = m.closest('details'); if (d) for (let x = d; x; x = x.parentElement.closest('details')) x.open = true; });
      counter.textContent = hits.length ? `${hits.length} 处` : '无匹配';
      if (hits.length) step(0);
    };
    const step = i => {
      if (!hits.length) return;
      hits.forEach(m => m.classList.remove('cur'));
      idx = (i + hits.length) % hits.length;
      hits[idx].classList.add('cur');
      if (rightEl.contains(hits[idx])) {
        shell.classList.remove('show-left');
        shell.classList.add('show-right'); // reveal hidden tool pane
        applyPaneLayout(panePreferred.left, panePreferred.right);
      }
      hits[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      counter.textContent = `${idx + 1}/${hits.length}`;
    };
    let timer;
    input.oninput = () => { clearTimeout(timer); timer = setTimeout(() => run(input.value), 200); };
    input.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); if (hits.length) step(idx + (e.shiftKey ? -1 : 1)); else run(input.value); }
    };
  }

  // ——— overview: a corpus-level landing when no session is selected ———
  const ovStat = (v, l) => `<div class="ov-stat"><b>${esc(String(v))}</b><span>${esc(l)}</span></div>`;
  function renderOverview() {
    ACTIVE = null;
    setPath('~/.claude/projects — 概览');
    leftEl.querySelectorAll('.srow').forEach(el => el.classList.remove('active'));
    rightEl.innerHTML = '';
    shell.classList.remove('show-right');
    applyPaneLayout(panePreferred.left, panePreferred.right);
    setInfoActive(false);

    // 概览统计来自后端「命中池全量」聚合（scope.matched），不受 maxSessions / 加载更多影响；
    // 独立网页无 matched 时回退到对当前 DATA.sessions 求和。
    const sc = DATA.scope || {};
    const m = sc.matched;
    const ss = DATA.sessions;
    let turns = 0, tools = 0, tok = 0, count = ss.length;
    let minTs = Infinity, maxTs = -Infinity;
    let projArr;
    if (m) {
      turns = m.turns || 0; tools = m.tools || 0; tok = m.tokens || 0;
      count = sc.total_matched != null ? sc.total_matched : ss.length;
      if (m.span_start) minTs = Date.parse(m.span_start);
      if (m.span_end) maxTs = Date.parse(m.span_end);
      projArr = (m.projects || []).map(([p, n]) => [p, n]);
    } else {
      const byProj = new Map();
      ss.forEach(s => {
        turns += s.num_user_msgs || 0;
        tools += s.num_tool_calls || 0;
        tok += (s.usage && s.usage.total) || 0;
        if (s.first_ts) minTs = Math.min(minTs, Date.parse(s.first_ts));
        if (s.last_ts) maxTs = Math.max(maxTs, Date.parse(s.last_ts));
        byProj.set(s.project_label, (byProj.get(s.project_label) || 0) + 1);
      });
      projArr = [...byProj.entries()].sort((a, b) => b[1] - a[1]);
    }
    const span = (isFinite(minTs) && isFinite(maxTs))
      ? `${niceDate(new Date(minTs).toISOString())} → ${niceDate(new Date(maxTs).toISOString())}` : '—';
    const maxCount = projArr.length ? projArr[0][1] : 1;

    let c = `<div class="dhead"><div class="crumbs">~/.claude/projects · ${count} 段会话 · ${projArr.length} 个项目</div>`
      + `<h1>会话回看</h1></div>`;
    c += `<div class="ov-stats">`
      + ovStat(count, '段会话') + ovStat(turns, '轮对话')
      + ovStat(tools, '工具调用') + ovStat(fmtTok(tok), 'Token') + `</div>`;
    c += `<div class="ov-span">${esc(span)}</div>`;

    c += `<div class="ov-sec"><div class="ov-h">项目分布</div>`;
    projArr.forEach(([p, n]) => {
      c += `<div class="ov-proj"><span class="ov-pname">${esc(p)}</span>`
        + `<span class="ov-pbar"><span style="width:${Math.round(n / maxCount * 100)}%"></span></span>`
        + `<span class="ov-pn">${n}</span></div>`;
    });
    c += `</div>`;

    c += `<div class="ov-sec"><div class="ov-h">最近会话</div><div class="ov-recent">`;
    ss.slice(0, 8).forEach(s => {
      const worktree = s.is_worktree && s.worktree_name ? ` · worktree: ${esc(s.worktree_name)}` : '';
      c += `<button class="ov-card" data-id="${esc(s.id)}">`
        + `<div class="ov-card-title">${srcBadge(s.source)}${esc(s.preview)}</div>`
        + `<div class="ov-card-meta">${esc(s.project_label)} · ${s.num_user_msgs} 轮 · ${s.num_tool_calls} 工具 · ${niceDate(s.last_ts)}${worktree}</div>`
        + `</button>`;
    });
    c += `</div></div>`;
    centerEl.innerHTML = c;
    centerEl.querySelectorAll('.ov-card').forEach(b =>
      b.onclick = () => { location.hash = '#s/' + b.dataset.id; });
    centerEl.scrollTop = 0;
  }

  function shouldRouteAfterIndexUpdate(state, changedIds) {
    if (!state) return true;
    if (!Array.isArray(changedIds)) return true;
    return changedIds.includes(state.id);
  }

  function route() {
    const state = parseRoute();
    if (state) { renderDetail(state.id); }
    else if (DATA.sessions.length) { renderOverview(); }
    else { centerEl.innerHTML = '<div class="empty">这个范围内还没有会话。试试 <code>--all</code>。</div>'; }
  }

  // mobile drawer toggles
  document.getElementById('tgl-left').onclick = () => {
    if (!shell.classList.contains('show-left')) shell.classList.remove('show-right');
    shell.classList.toggle('show-left');
  };
  document.getElementById('tgl-right').onclick = () => {
    if (!shell.classList.contains('show-right')) shell.classList.remove('show-left');
    shell.classList.toggle('show-right');
    applyPaneLayout(panePreferred.left, panePreferred.right);
  };
  // 详细 — toggle the active agent info panel in the right pane.
  // Exposed on window.__agentSession so the native toolbar button can drive it too.
  function toggleInfo() {
    if (ACTIVE && ACTIVE.rightMode === 'info' && shell.classList.contains('show-right')) {
      shell.classList.remove('show-right');
      applyPaneLayout(panePreferred.left, panePreferred.right);
      ACTIVE.rightMode = null;
      setInfoActive(false);
      setSessionRoute(ACTIVE.id, ACTIVE.tab, null, { silent: true });
    } else {
      showInfo();
    }
  }
  document.getElementById('tgl-info').onclick = toggleInfo;

  // App 注入入口：原生壳运行时调用它喂入最新数据。
  // template 因此既能当独立网页（#session-data 内嵌），也能被 App 注入。
  window.__agentSession = {
    loadIndex(jsonText, changedIds) {
      const state = parseRoute();
      const pinned = state && ACTIVE && ACTIVE.id === state.id ? ACTIVE.session : (state ? byId[state.id] : null);
      const shouldRoute = shouldRouteAfterIndexUpdate(state, changedIds);
      DATA = JSON.parse(jsonText);
      if (!Array.isArray(DATA.sessions)) DATA.sessions = [];
      rebuildIndex();
      if (state && pinned && !shouldRoute) byId[state.id] = pinned;
      // 搜索结果展示中：用最新数据重跑搜索，而不是回退到普通列表把结果冲掉。
      if (searchActive && lastSearchQuery && bridge('search')) bridge('search').postMessage({ query: lastSearchQuery });
      else renderSidebar();
      if (shouldRoute) route();
      else if (ACTIVE && ACTIVE.id === state.id && ACTIVE.pending) {
        if (pinned) { pinned.__detail_loading = false; pinned.__detail_failed = false; }
        renderDetail(state.id);
      } else highlightSidebar(state.id);
    },
    setPaneLayout(left, right) { applyPaneLayout(left, right, { preferred: true }); },
    // Backward-compatible alias for standalone/generated pages that still call load().
    load(jsonText) { this.loadIndex(jsonText); },
    loadDetail(id, jsonText, token) {
      const s = byId[id];
      if (!s || token !== s.__detail_token) return;
      const state = parseRoute();
      const isCurrent = state && state.id === id;
      if (!jsonText) {
        s.__detail_loading = false;
        s.__detail_failed = true;
        if (isCurrent) renderDetail(id);
        return;
      }
      const detail = JSON.parse(jsonText);
      detail.__detail_loading = false;
      detail.__detail_failed = false;
      detail.__detail_token = token;
      byId[id] = detail;
      const idx = DATA.sessions.findIndex(x => x.id === id);
      if (idx >= 0) DATA.sessions[idx] = detail;
      if (isCurrent) renderDetail(id);
    },
    loadSearchResults(jsonText) {
      let res; try { res = JSON.parse(jsonText); } catch (e) { return; }
      renderSearchResults(res);
    },
    toggleInfo
  };
  bindPaneResizers();
  rebuildIndex();
  renderSidebar();
  window.addEventListener('hashchange', route);
  if (HAS_INITIAL) route();
  else centerEl.innerHTML = '<div class="empty">加载中…</div>';
})();
</script>
</body>
</html>
