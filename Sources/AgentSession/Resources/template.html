<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>session viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    /* shared shell with session-report */
    --ivory: #FAF9F5;
    --term-bg: #1a1918;
    --titlebar: #252321;
    --outline: rgba(255,255,255,0.08);
    --hover: rgba(255,255,255,0.04);
    --clay: #D97757;        /* human / primary accent */
    /* agent prose on the terminal */
    --cream: #e7e3d8;
    --gold: #d6a566;        /* agent voice */
    /* machine layer — one cool family */
    --slate: #8e9ac8;
    --slate-dim: #646c8c;
    --slate-faint: #4a4f63;
    /* status only */
    --term-fg: #d1cfc5;
    --dim: rgb(136,136,136);
    --subtle: rgb(96,96,96);
    --red: rgb(232,103,121);
    --green: rgb(95,184,120);
    --pane-left-width: 256px;
    --pane-right-width: 360px;
    --pane-resizer-width: 8px;
    --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Monaco, monospace;
    --serif: 'Newsreader', Georgia, 'Songti SC', 'Noto Serif CJK SC', serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--ivory); }
  body {
    margin: 0; padding: 22px;
    font: 13px/1.6 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--term-fg);
    -webkit-font-smoothing: antialiased;
  }
  .term {
    max-width: 1680px; margin: 0 auto;
    height: calc(100vh - 44px);
    display: flex; flex-direction: column;
    background: var(--term-bg);
    border-radius: 8px;
    outline: 1px solid var(--outline);
    box-shadow: 0 24px 70px rgba(20,20,19,0.26);
    overflow: hidden;
  }
  .titlebar {
    background: var(--titlebar);
    border-bottom: 1px solid var(--outline);
    padding: 11px 14px;
    display: flex; align-items: center; gap: 7px;
    flex-shrink: 0;
  }
  .titlebar .dot { width: 11px; height: 11px; border-radius: 50%; background: #3a3836; }
  .titlebar .path { margin-left: 14px; color: var(--dim); font-size: 11px; flex: 1;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .titlebar .tgl { display: none; background: none; border: 1px solid var(--slate-faint);
                   color: var(--slate); font: 500 11px var(--mono); padding: 4px 9px;
                   border-radius: 4px; cursor: pointer; }
  .titlebar .tgl:hover, .titlebar .tgl:focus-visible { border-color: var(--clay); color: var(--clay); outline: none; }
  /* always-visible "详细" toggle — opens session info in the right pane */
  .titlebar .tinfo { display: inline-block; background: none; border: 1px solid var(--slate-faint);
                     color: var(--slate); font: 500 11px var(--mono); padding: 4px 10px;
                     border-radius: 4px; cursor: pointer; }
  .titlebar .tinfo:hover, .titlebar .tinfo:focus-visible { border-color: var(--clay); color: var(--clay); outline: none; }
  .titlebar .tinfo.active { border-color: var(--clay); color: var(--clay); background: rgba(217,119,87,0.12); }

  /* ——— native host (macOS app): drop the simulated window chrome ——— */
  /* The standalone web page draws its own floating "terminal window" (traffic-light
     dots + rounded card + shadow). Inside the real NSWindow that doubles up into a
     window-in-window, so when the app injects `html.native` we flatten it to fill the
     real window edge-to-edge. 详细 then lives in the native toolbar (see AppDelegate). */
  html.native { background: var(--term-bg); }
  html.native body { padding: 0; }
  html.native .term { max-width: none; margin: 0; height: 100vh;
                      border-radius: 0; outline: none; box-shadow: none; }
  html.native .titlebar { display: none; }
  /* keep the drawer toggles reachable if the native window is shrunk narrow */
  @media (max-width: 1100px) {
    html.native .titlebar { display: flex; }
    html.native .titlebar .dot,
    html.native .titlebar .path,
    html.native .titlebar .tinfo { display: none; }
  }

  /* ——— three-pane shell ——— */
  /* the right (tool) pane is collapsed by default — it slides open only when a
     tool anchor in the middle column is clicked (see .show-right). */
  .shell { flex: 1; display: grid;
           grid-template-columns: var(--pane-left-width) var(--pane-resizer-width) minmax(0, 1fr) 0px 0px;
           min-height: 0; transition: grid-template-columns .2s ease; }
  .shell.show-right {
    grid-template-columns: var(--pane-left-width) var(--pane-resizer-width) minmax(0, 1fr) var(--pane-resizer-width) var(--pane-right-width);
  }
  .shell.resizing { transition: none; cursor: col-resize; }
  .shell.resizing, .shell.resizing * { user-select: none; }
  .pane-left  { grid-column: 1; border-right: 1px solid var(--outline); overflow: auto; min-height: 0;
                display: flex; flex-direction: column; }
  .pane-center{ grid-column: 3; overflow: auto; min-height: 0; padding: 20px 30px 48px; }
  .pane-right { grid-column: 5; overflow: hidden; min-width: 0; min-height: 0;
                padding: 0; background: rgba(0,0,0,0.10); }
  .shell.show-right .pane-right { border-left: 1px solid var(--outline); overflow: auto;
                                  padding: 14px 14px 48px; }
  .pane-resizer { min-width: 0; cursor: col-resize; position: relative; background: var(--term-bg);
                  z-index: 4; touch-action: none; }
  .pane-resizer.left { grid-column: 2; }
  .pane-resizer.right { grid-column: 4; opacity: 0; pointer-events: none; }
  .shell.show-right .pane-resizer.right { opacity: 1; pointer-events: auto; }
  .pane-resizer::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px;
                          transform: translateX(-50%); background: var(--outline);
                          transition: background .12s, box-shadow .12s; }
  .pane-resizer:hover::before, .pane-resizer.dragging::before {
    background: var(--clay); box-shadow: 0 0 0 1px rgba(217,119,87,0.16);
  }

  /* ——— left pane: project-grouped session list ——— */
  .side-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--outline);
               position: sticky; top: 0; background: var(--term-bg); z-index: 2; }
  .cmd { color: var(--dim); margin-bottom: 9px; font-size: 12px; }
  .cmd .prompt { color: var(--clay); }
  .side-search { width: 100%; background: rgba(255,255,255,0.03);
                 border: 1px solid var(--outline); border-radius: 5px; color: var(--term-fg);
                 font: 12px var(--mono); padding: 7px 10px; }
  .side-search:focus { outline: none; border-color: var(--clay); }
  .side-search::placeholder { color: var(--subtle); }
  .side-count { display: block; color: var(--slate); font-size: 10px; margin-top: 6px; min-height: 12px; }
  /* scope filters (native app injects DATA.controls; standalone web omits them) */
  .side-filters { display: flex; gap: 6px; margin-bottom: 9px; }
  .side-sel { flex: 1; min-width: 0; -webkit-appearance: none; appearance: none;
              background: rgba(255,255,255,0.03)
                url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='10'%20height='6'%3E%3Cpath%20d='M1%201l4%204%204-4'%20stroke='%238e9ac8'%20fill='none'%20stroke-width='1.4'/%3E%3C/svg%3E")
                no-repeat right 9px center;
              border: 1px solid var(--outline); border-radius: 5px; color: var(--term-fg);
              font: 11px var(--mono); padding: 6px 24px 6px 9px; cursor: pointer;
              text-overflow: ellipsis; }
  .side-sel:focus { outline: none; border-color: var(--clay); }
  .side-sel:hover { border-color: var(--slate-faint); }
  .side-list { flex: 1; padding: 6px 0 24px; }

  .sgroup { border-bottom: 1px solid var(--outline); }
  .sgroup > summary { list-style: none; cursor: pointer; padding: 9px 14px;
                      display: flex; align-items: center; gap: 8px;
                      color: var(--slate); font-size: 11px; letter-spacing: 0.02em; }
  .sgroup > summary::-webkit-details-marker { display: none; }
  .sgroup > summary::before { content: '▸'; color: var(--slate-faint); font-size: 10px; }
  .sgroup[open] > summary::before { content: '▾'; }
  .sgroup > summary .gname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sgroup > summary .gcount { color: var(--subtle); font-size: 10px; }

  .srow { display: block; width: 100%; text-align: left; background: none; border: none;
          border-left: 2px solid transparent; padding: 9px 14px 10px 22px; cursor: pointer;
          color: inherit; font: inherit; }
  .srow:hover { background: var(--hover); }
  .srow:focus-visible { outline: 2px solid var(--clay); outline-offset: -2px; }
  .srow.active { background: rgba(217,119,87,0.10); border-left-color: var(--clay); }
  .srow-title { font-family: var(--serif); font-size: 14px; color: var(--cream);
                line-height: 1.35; overflow: hidden; text-overflow: ellipsis;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .srow.active .srow-title, .srow:hover .srow-title { color: var(--clay); }
  .load-more { display: block; width: calc(100% - 28px); margin: 10px 14px 4px; padding: 8px;
               background: rgba(255,255,255,0.03); border: 1px solid var(--outline);
               border-radius: 6px; color: var(--slate); font: inherit; font-size: 12px;
               cursor: pointer; text-align: center; }
  .load-more:hover { background: var(--hover); color: var(--cream); }
  .load-more:disabled { opacity: 0.5; cursor: default; }
  .srow-meta { color: var(--dim); font-size: 10px; margin-top: 4px; }
  .srow-snip { color: var(--slate); font-size: 11px; line-height: 1.5; margin-top: 5px;
               overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
               -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .srow-tags { margin-top: 6px; line-height: 1.9; }

  .chip { display: inline-block; padding: 1px 8px; border-radius: 3px;
          border: 1px solid var(--slate-faint); font-size: 10px; color: var(--slate);
          margin-right: 5px; }
  .chip.worktree { border-color: rgba(217,119,87,0.65); color: var(--cream);
                   background: rgba(217,119,87,0.16); max-width: 100%; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
  /* 数据来源图标徽标：官方品牌 logo（currentColor 着色），暖橙=Claude，冷蓝=Codex。 */
  .src-ic { display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; border-radius: 4px; margin-right: 6px;
            vertical-align: middle; flex: 0 0 auto; }
  .src-ic svg { width: 11px; height: 11px; display: block; fill: currentColor; }
  .src-ic.codex { color: #a9c7ff; background: rgba(90,140,240,0.16); }
  .src-ic.claude { color: var(--cream); background: rgba(217,119,87,0.18); }

  /* ——— overview (landing view when no session is selected) ——— */
  .ov-stats { display: flex; gap: 40px; flex-wrap: wrap; margin: 22px 0 10px; }
  .ov-stat b { display: block; font-family: var(--serif); font-size: 32px;
               font-weight: 500; color: var(--cream); line-height: 1; }
  .ov-stat span { display: block; font-size: 10px; letter-spacing: 0.1em;
                  text-transform: uppercase; color: var(--slate); margin-top: 8px; }
  .ov-span { color: var(--dim); font-size: 11px; margin-bottom: 8px; }
  .ov-sec { margin: 26px 0; }
  .ov-h { color: var(--slate); font-size: 10px; letter-spacing: 0.06em;
          text-transform: uppercase; margin-bottom: 13px; }
  .ov-proj { display: flex; align-items: center; gap: 12px; padding: 5px 0; }
  .ov-pname { flex: 0 0 220px; max-width: 40%; color: var(--cream); font-size: 12px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ov-pbar { flex: 1; height: 6px; background: rgba(142,154,200,0.12);
             border-radius: 4px; overflow: hidden; }
  .ov-pbar span { display: block; height: 100%; background: var(--slate); }
  .ov-pn { flex: 0 0 auto; color: var(--dim); font-size: 11px; min-width: 24px; text-align: right; }
  .ov-recent { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .ov-card { text-align: left; background: rgba(255,255,255,0.02);
             border: 1px solid var(--outline); border-radius: 8px; padding: 13px 15px;
             cursor: pointer; color: inherit; font: inherit; }
  .ov-card:hover { border-color: var(--clay); background: rgba(217,119,87,0.06); }
  .ov-card:focus-visible { outline: 2px solid var(--clay); outline-offset: -2px; }
  .ov-card-title { font-family: var(--serif); font-size: 15px; color: var(--cream);
                   line-height: 1.4; max-height: 2.8em; overflow: hidden; }
  .ov-card:hover .ov-card-title { color: var(--clay); }
  .ov-card-meta { color: var(--dim); font-size: 10px; margin-top: 8px; }

  .empty { font-family: var(--serif); font-size: 16px; color: var(--dim);
           padding: 40px 0; text-align: center; }
  .empty code { color: var(--slate); }

  /* ——— agent tab bar ——— */
  .tabs { display: flex; gap: 4px; align-items: flex-end; overflow-x: auto;
          border-bottom: 1px solid var(--outline); margin: -4px -4px 16px; padding: 2px 4px 0;
          position: sticky; top: -20px; background: var(--term-bg); z-index: 3; padding-top: 18px; }
  .tab { flex-shrink: 0; background: none; border: 1px solid var(--outline); border-bottom: none;
         color: var(--dim); font: 500 11px var(--mono); padding: 7px 13px; cursor: pointer;
         border-radius: 6px 6px 0 0; max-width: 340px; overflow: hidden;
         text-overflow: ellipsis; white-space: nowrap; }
  .tab:hover { color: var(--cream); }
  .tab.active { color: var(--cream); background: rgba(255,255,255,0.05); border-color: var(--outline); }
  .tab-main { color: var(--gold); border-color: rgba(214,165,102,0.4); }
  .tab-main.active { color: #fff; background: rgba(214,165,102,0.14); border-color: rgba(214,165,102,0.6); }
  .tab-sub.active { color: var(--slate); border-color: rgba(142,154,200,0.5); background: rgba(142,154,200,0.10); }
  .tab-group { display: flex; gap: 4px; align-items: flex-end; flex-shrink: 0; }
  .tab-group + .tab-group { margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--outline); }
  .tab-group-label { align-self: center; color: var(--subtle); font: 500 10px var(--mono);
                     padding: 0 2px 7px; white-space: nowrap; }

  /* ——— detail header ——— */
  h1 { all: unset; display: block; font-family: var(--serif);
       font-size: 24px; font-weight: 500; letter-spacing: -0.01em;
       color: var(--cream); line-height: 1.25; }
  .hr { border: none; border-top: 1px solid var(--outline); margin: 16px 0 14px; }
  .dhead .crumbs { color: var(--subtle); font-size: 11px; margin-bottom: 10px; word-break: break-all; }
  .dhead .stats { color: var(--dim); font-size: 11px; margin-top: 12px;
                  display: flex; gap: 18px; flex-wrap: wrap; }
  .dhead .stats b { color: var(--clay); font-weight: 700; }
  /* ——— right-edge table of contents: ONE card hugging the center pane's
     right edge as a thin tick-spine, widening on hover/focus to reveal the
     turn list. A single continuous hover surface — spine and list live in the
     same box, so there is no gap to fall through. ——— */
  .toc-rail { position: sticky; top: 0; height: 0; z-index: 6; pointer-events: none; }
  .toc-rail-inner {
    position: absolute; top: 16px; right: -26px;
    display: flex; justify-content: flex-end; align-items: flex-start; gap: 12px;
    width: 40px; overflow: hidden;
    padding: 8px 4px 8px 8px; border-radius: 10px;
    background: transparent; border: 1px solid transparent; box-shadow: none;
    pointer-events: auto;
    transition: width .22s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease;
  }
  .toc-rail-inner:hover, .toc-rail-inner:focus-within {
    width: 396px;
    background: var(--titlebar); border-color: var(--outline);
    box-shadow: 0 18px 50px rgba(20,20,19,0.5);
  }
  /* the spine — pinned right, always visible; doubles as the scroll-spy display */
  .toc-ticks { order: 1; flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    max-height: 62vh; overflow: hidden; }
  .toc-tick { display: block; width: 14px; height: 2px; border-radius: 1px;
    background: var(--slate-faint); cursor: pointer;
    transition: width .18s ease, background .18s ease; }
  .toc-tick:hover { width: 22px; background: var(--slate); }
  .toc-tick.active { width: 24px; background: var(--clay); }
  /* the turn list — clipped to zero width while collapsed, wiped in on expand */
  .toc-panel { order: 0; flex: 0 0 auto; width: 342px;
    max-height: 62vh; overflow-y: auto; overflow-x: hidden;
    opacity: 0; transition: opacity .18s ease; }
  .toc-rail-inner:hover .toc-panel,
  .toc-rail-inner:focus-within .toc-panel { opacity: 1; }
  .toc-panel-head { color: var(--slate); font-size: 11px; margin-bottom: 9px; white-space: nowrap; }
  .toc-panel ol { margin: 0; padding: 0; list-style: none; }
  .toc-panel li { padding: 1px 0; }
  .toc-panel a { color: var(--dim); text-decoration: none; display: flex; gap: 10px;
    align-items: flex-start; font-size: 12px; line-height: 1.45; padding: 4px 6px; border-radius: 5px; }
  .toc-panel a:hover { color: var(--clay); background: var(--hover); }
  .toc-panel a.active { color: var(--clay); }
  .toc-panel a .n { color: var(--slate-faint); flex-shrink: 0; padding-top: 1px; }
  .toc-panel a.active .n { color: var(--clay); }
  /* up to two lines per turn, then ellipsis */
  .toc-panel a .t { min-width: 0; display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; white-space: normal;
    overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) {
    .toc-tick, .toc-panel, .toc-rail-inner { transition: none; }
  }

  /* ——— exchanges: one human turn + the agent's work beneath it ——— */
  .exchange { margin: 24px 0; }
  .agent-track { margin: 6px 0 0 6px; padding-left: 20px;
                 border-left: 2px solid rgba(142,154,200,0.42); }

  .who { font: 500 10px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase;
         margin-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; }
  .who .ts { color: var(--subtle); font-size: 10px; letter-spacing: 0; }

  /* user — warm clay-tinted panel on the terminal */
  .msg-user { background: rgba(217,119,87,0.07); color: var(--cream);
              border: 1px solid rgba(217,119,87,0.22); border-left: 3px solid var(--clay);
              border-radius: 7px; padding: 13px 17px; scroll-margin-top: 64px; }
  .msg-user .who { color: var(--clay); }
  .msg-user .who .ts { color: var(--subtle); }
  .msg-user .text { font-family: var(--serif); font-size: 15.5px; line-height: 1.7;
                    word-break: break-word; }
  .msg-user.slash .text { font-family: var(--mono); font-size: 13px; color: var(--clay); font-weight: 700; }
  .msg-user.slash .cmd-args { display: block; margin-top: 7px; font-family: var(--serif); font-size: 15px;
                              line-height: 1.65; color: var(--cream); font-weight: 400; white-space: pre-wrap; }

  /* expandable skill body (SKILL.md injected by a slash command) */
  .skill-doc { margin-top: 11px; border-top: 1px dashed rgba(217,119,87,0.3); padding-top: 9px; }
  .skill-doc > summary { list-style: none; cursor: pointer; color: var(--clay);
                         font: 500 11px var(--mono); letter-spacing: 0.04em; }
  .skill-doc > summary::-webkit-details-marker { display: none; }
  .skill-doc > summary::before { content: '▸ '; }
  .skill-doc[open] > summary::before { content: '▾ '; }
  .skill-doc .skill-body { max-height: 440px; overflow: auto; margin-top: 10px;
                           padding: 12px 14px; background: rgba(0,0,0,0.16);
                           border-radius: 7px; }
  .skill-doc .skill-body.text { font-size: 13.5px; line-height: 1.62; color: var(--cream); }
  .skill-doc .skill-body.text h1 { font-size: 16px; }
  .skill-doc .skill-body.text h2 { font-size: 14.5px; }

  /* assistant prose — cream serif on the terminal */
  .msg-asst { padding: 4px 0 6px; }
  .msg-asst .who { color: var(--gold); }
  .msg-asst .text { font-family: var(--serif); font-size: 15px; line-height: 1.72;
                    color: var(--cream); word-break: break-word; }

  /* ——— markdown inside human/agent prose ———
     headings & lists stay in the serif "human" voice; code & tables drop into
     the mono "machine" layer (slate, hairline rules) to keep the duality. */
  .text > :first-child { margin-top: 0; }
  .text > :last-child { margin-bottom: 0; }
  .text p { margin: 0.55em 0; }
  .text h1, .text h2, .text h3, .text h4, .text h5, .text h6 {
    font-family: var(--serif); font-weight: 600; line-height: 1.3;
    margin: 0.95em 0 0.4em; color: var(--cream); }
  .text h1 { font-size: 20px; }
  .text h2 { font-size: 17.5px; padding-bottom: 4px; border-bottom: 1px solid var(--outline); }
  .text h3 { font-size: 15.5px; color: var(--gold); }
  .text h4, .text h5, .text h6 { font-size: 13.5px; color: var(--gold); }
  .text ul, .text ol { margin: 0.5em 0; padding-left: 1.45em; }
  .text li { margin: 0.22em 0; }
  .text ul.md-list li::marker { color: var(--clay); }
  .text ol.md-list li::marker { color: var(--slate); font-family: var(--mono); }
  .text a { color: var(--clay); text-decoration: underline; text-underline-offset: 2px; }
  .text strong { color: #fff; font-weight: 600; }
  .text del { color: var(--subtle); }
  .text code { font-family: var(--mono); font-size: 0.85em; color: var(--slate);
               background: rgba(142,154,200,0.13); padding: 1px 5px; border-radius: 3px; }
  pre.md-pre { font: 12px/1.55 var(--mono); white-space: pre; overflow-x: auto;
               max-width: 100%; color: var(--term-fg); background: rgba(255,255,255,0.025);
               border: 1px solid var(--outline); border-radius: 6px;
               padding: 10px 12px; margin: 0.7em 0; }
  .text blockquote.md-quote { margin: 0.6em 0; padding: 3px 14px;
                              border-left: 3px solid var(--slate-faint); color: var(--dim); }
  .text hr.md-hr { border: none; border-top: 1px solid var(--outline); margin: 1em 0; }
  .text .md-tablewrap { overflow-x: auto; margin: 0.7em 0; }
  .text table.md-table { border-collapse: collapse; font: 12px/1.5 var(--mono); }
  .text table.md-table th, .text table.md-table td {
    border: 1px solid var(--outline); padding: 6px 11px; text-align: left; vertical-align: top; }
  .text table.md-table th { color: var(--slate); font-weight: 500; background: rgba(142,154,200,0.06); }
  .text table.md-table td { color: var(--term-fg); }

  /* ——— toolbar: search + expand/collapse ——— */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0 4px; }
  .search { flex: 1; min-width: 160px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--outline); border-radius: 5px; color: var(--term-fg);
            font: 12px var(--mono); padding: 7px 11px; }
  .search:focus { outline: none; border-color: var(--clay); }
  .search::placeholder { color: var(--subtle); }
  .search-count { color: var(--slate); font-size: 11px; min-width: 44px; }
  .tbtn { background: none; border: 1px solid var(--slate-faint); color: var(--slate);
          font: 500 11px var(--mono); padding: 6px 11px; border-radius: 5px; cursor: pointer; }
  .tbtn:hover, .tbtn:focus-visible { border-color: var(--clay); color: var(--clay); outline: none; }
  .tbtn.active { border-color: var(--clay); color: var(--clay); background: rgba(217,119,87,0.12); }

  mark.hit { background: rgba(255,193,7,0.28); color: inherit; border-radius: 2px; }
  mark.hit.cur { background: var(--clay); color: #1a1918; }

  /* ——— middle-column tool anchors (one-liners that point at the right pane) ——— */
  .tool-anchor { display: flex; gap: 9px; align-items: baseline; width: 100%; text-align: left;
                 background: none; border: none; border-left: 2px solid var(--slate-faint);
                 padding: 4px 0 4px 11px; margin: 3px 0; cursor: pointer; color: var(--dim);
                 font: 12px var(--mono); }
  .tool-anchor:hover { color: var(--clay); border-left-color: var(--clay); background: var(--hover); }
  .tool-anchor:focus-visible { outline: 2px solid var(--clay); outline-offset: -2px; }
  .tool-anchor .ta-ic { color: var(--slate-dim); flex-shrink: 0; }
  .tool-anchor .ta-name { color: var(--slate); font-weight: 500; flex-shrink: 0; }
  .tool-anchor:hover .ta-name { color: var(--clay); }
  .tool-anchor .ta-arg { color: var(--dim); flex: 1; min-width: 0; overflow: hidden;
                         text-overflow: ellipsis; white-space: nowrap; }
  .tool-anchor.has-error .ta-name { color: var(--red); }
  .tool-anchor.agent-jump { border-left-color: rgba(142,154,200,0.5); }
  .tool-anchor.agent-jump .ta-ic, .tool-anchor.agent-jump .ta-name { color: var(--slate); }
  .tool-anchor.agent-jump:hover { color: var(--slate); border-left-color: var(--slate); }
  .tool-anchor.agent-jump:hover .ta-name { color: var(--cream); }

  /* ——— right pane: tool detail cards ——— */
  .rhead { color: var(--slate); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
           padding: 2px 4px 12px; border-bottom: 1px solid var(--outline); margin-bottom: 10px;
           position: sticky; top: 0; background: var(--term-bg); z-index: 2;
           display: flex; align-items: center; gap: 8px; }
  .rhead .rtitle { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rhead b { color: var(--cream); font-weight: 500; text-transform: none; }
  .rclose { flex-shrink: 0; background: none; border: 1px solid var(--slate-faint);
            color: var(--slate); font: 500 13px/1 var(--mono); padding: 3px 8px; border-radius: 4px;
            cursor: pointer; }
  .rclose:hover, .rclose:focus-visible { border-color: var(--clay); color: var(--clay); outline: none; }
  .rempty { color: var(--subtle); font-size: 12px; padding: 24px 6px; text-align: center; }

  /* session info panel (right pane, opened by 详细) */
  .sinfo { font-size: 12px; }
  .sinfo-sec { margin: 2px 0 18px; }
  .sinfo-h { color: var(--slate); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
             margin: 12px 0 7px; }
  .sinfo-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0;
               border-bottom: 1px solid var(--outline); color: var(--dim); }
  .sinfo-row b { color: var(--cream); font-weight: 500; }
  .sinfo-row.id b { font-family: var(--mono); font-size: 11px; text-align: right; word-break: break-all; }
  .sinfo-row.sub { color: var(--subtle); padding-left: 12px; }
  .sinfo-row.wrap { display: block; }
  .sinfo-row.wrap b { display: block; margin-top: 4px; line-height: 1.45; word-break: break-word; }
  .cbar { height: 7px; border-radius: 4px; background: rgba(142,154,200,0.15);
          overflow: hidden; margin: 4px 0 8px; }
  .cbar span { display: block; height: 100%; background: var(--clay); }

  details.tcard { margin: 4px 0; border: 1px solid var(--outline); border-radius: 6px;
                  background: rgba(255,255,255,0.015); }
  details.tcard > summary { list-style: none; cursor: pointer; color: var(--dim);
                            padding: 8px 10px; display: flex; gap: 8px; align-items: baseline;
                            font-size: 12px; }
  details.tcard > summary::-webkit-details-marker { display: none; }
  details.tcard > summary::before { content: '▸'; color: var(--slate-faint); flex-shrink: 0; }
  details.tcard[open] > summary::before { content: '▾'; }
  details.tcard > summary .icon { flex-shrink: 0; color: var(--slate-dim); }
  details.tcard > summary .lbl { font-weight: 500; flex-shrink: 0; color: var(--slate); }
  details.tcard > summary .arg { color: var(--subtle); overflow: hidden;
                                 text-overflow: ellipsis; white-space: nowrap; }
  details.tcard > :not(summary) { padding: 0 10px; }
  details.tcard > :last-child { padding-bottom: 10px; }
  details.tcard.has-error { border-color: rgba(232,103,121,0.4); }
  details.tcard.has-error > summary .lbl { color: var(--red); }
  details.tcard.flash { animation: flash 1.1s ease-out; }
  @keyframes flash { from { background: rgba(217,119,87,0.22); } to { background: rgba(255,255,255,0.015); } }

  /* thinking — collapsible machine layer, lives in the middle column */
  details.blk { margin: 5px 0; }
  details.blk > summary { list-style: none; cursor: pointer; color: var(--dim);
                          padding: 4px 0; display: flex; gap: 9px; align-items: baseline;
                          font-size: 12px; }
  details.blk > summary::-webkit-details-marker { display: none; }
  details.blk > summary::before { content: '▸'; color: var(--slate-faint); flex-shrink: 0; }
  details.blk[open] > summary::before { content: '▾'; }
  details.blk .icon { flex-shrink: 0; color: var(--slate-dim); }
  details.blk .lbl { font-weight: 500; flex-shrink: 0; }
  details.blk .pane { white-space: pre-wrap; word-break: break-word;
                      font: 12px/1.55 var(--mono); color: var(--term-fg);
                      background: rgba(255,255,255,0.022); border-radius: 5px;
                      padding: 10px 12px; margin: 4px 0 8px; max-height: 460px; overflow: auto; }
  details.think > summary .lbl { color: var(--slate-dim); }
  details.think .pane { color: #9aa0b8; font-style: italic; font-family: var(--serif); font-size: 13.5px; }

  /* tool input/output panes (inside tcards) */
  .io-label { font: 500 10px/1 var(--mono); letter-spacing: 0.05em; color: var(--slate-dim);
              margin: 8px 0 3px; }
  .io-label.res { color: var(--gold); }
  .io-label.res.error { color: var(--red); }
  .io-note { color: var(--subtle); font-size: 11px; margin: 3px 0 4px; }
  .err-flag { color: var(--red); font-size: 10px; border: 1px solid rgba(232,103,121,0.5);
              border-radius: 3px; padding: 0 5px; }
  .pane { white-space: pre-wrap; word-break: break-word; font: 12px/1.55 var(--mono);
          color: var(--term-fg); background: rgba(255,255,255,0.022); border-radius: 5px;
          padding: 10px 12px; margin: 4px 0 8px; max-height: 460px; overflow: auto; }
  .pane.error { border-left: 2px solid var(--red); }
  pre.md-pre.diff { padding: 8px 10px; }
  .dl { display: block; }
  .dl.old { color: #e0a0a8; background: rgba(232,103,121,0.08); }
  .dl.new { color: #a6d8b4; background: rgba(95,184,120,0.10); }
  .clip-note { color: var(--gold); font-size: 11px; margin-top: 4px; font-family: var(--mono); }

  /* copy button on tool input panes */
  .codewrap { position: relative; }
  .copy-btn { position: absolute; top: 6px; right: 6px; z-index: 2;
              background: var(--titlebar); border: 1px solid var(--slate-faint);
              color: var(--slate); font: 500 10px var(--mono); letter-spacing: 0.04em;
              padding: 3px 9px; border-radius: 4px; cursor: pointer;
              opacity: 0; transition: opacity .12s, color .12s, border-color .12s; }
  .codewrap:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; outline: none; }
  .copy-btn:hover { border-color: var(--clay); color: var(--clay); }
  .copy-btn.ok { opacity: 1; color: var(--green); border-color: var(--green); }
  @media (hover: none) { .copy-btn { opacity: 1; } }

  footer { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--outline);
           color: var(--subtle); font-size: 11px; word-break: break-all; }
  code { color: var(--slate); }
  a { color: var(--clay); }
  ::selection { background: var(--clay); color: var(--term-bg); }

  /* ——— responsive: collapse side panes into slide-over drawers ——— */
  @media (max-width: 1100px) {
    .titlebar .tgl.r { display: inline-block; }
    /* right pane becomes an overlay drawer — keep it out of the grid track */
    .shell, .shell.show-right { grid-template-columns: 256px minmax(0, 1fr); }
    .pane-resizer { display: none; }
    .pane-center { grid-column: 2; }
    .pane-right, .shell.show-right .pane-right {
                  position: fixed; top: 0; right: 0; height: 100vh; width: 380px; max-width: 88vw;
                  z-index: 20; background: var(--term-bg); transform: translateX(100%);
                  transition: transform .2s; border-left: 1px solid var(--outline);
                  overflow: auto; padding: 14px 14px 48px; box-shadow: -20px 0 50px rgba(0,0,0,0.4); }
    .shell.show-right .pane-right { transform: none; }
  }
  @media (max-width: 760px) {
    body { padding: 0; }
    .term { height: 100vh; border-radius: 0; }
    .titlebar .dot { display: none; }
    .titlebar .tgl.l { display: inline-block; }
    .shell, .shell.show-right { grid-template-columns: 1fr; }
    .pane-left { position: fixed; top: 0; left: 0; height: 100vh; width: 300px; max-width: 86vw;
                 z-index: 20; background: var(--term-bg); transform: translateX(-100%);
                 transition: transform .2s; box-shadow: 20px 0 50px rgba(0,0,0,0.4); }
    .shell.show-left .pane-left { transform: none; }
    .pane-center { grid-column: 1; padding: 16px 16px 40px; }
    h1 { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="term">
  <div class="titlebar">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="path" id="title-path">~/.claude/projects — session-viewer</span>
    <button class="tinfo" id="tgl-info" type="button" title="当前 Agent 信息（Token / 缓存）">ⓘ 详细</button>
    <button class="tgl l" id="tgl-left" type="button">☰ 会话</button>
    <button class="tgl r" id="tgl-right" type="button">工具 ⚙</button>
  </div>
  <div class="shell" id="shell">

  </div>
</div>

  const srcBadge = source => {
    const codex = source === 'codex';
    return `<span class="src-ic ${codex ? 'codex' : 'claude'}" title="${codex ? 'Codex' : 'Claude Code'}">`
      + (codex ? ICON_OPENAI : ICON_CLAUDE) + `</span>`;
  };
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const niceDate = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' :
    `${MON[d.getMonth()]} ${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
  const niceTime = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' :
    `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; };
  const dur = ms => { if (!ms) return '0m'; const m = Math.round(ms/60000);
